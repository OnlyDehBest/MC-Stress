[package]
name = "mc-stress"
version = "0.1.0"
edition = "2021"
description = "Load/stress test per server Minecraft: client raw su tokio (offline-mode) + dashboard axum con breaking point"

[dependencies]
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
axum = { version = "0.7.9", features = ["ws"] }
futures-util = "0.3.31"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
flate2 = "1.0.34"
rand = "0.8.5"

[profile.release]
opt-level = 3
lto = true
